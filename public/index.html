<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Classic Color Lines 9x9 puzzle game — align 5 or more matching balls horizontally, vertically, or diagonally.">
  <title>Color Lines 9×9 · Vibecode Workshop</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand-group">
      <a class="wordmark" href="/">VIBECODE<span> / COLOR LINES 9×9</span></a>
      <h1>Color Lines</h1>
    </div>
    <div class="hud-bar" role="region" aria-label="Game controls and score">
      <div class="hud-stat">
        <span class="hud-label">Score</span>
        <strong id="score-value" class="hud-score">0</strong>
      </div>
      <div class="hud-stat">
        <span class="hud-label">Best</span>
        <strong id="high-score-value" class="hud-score">0</strong>
      </div>
      <div class="hud-stat hud-upcoming" title="3 semi-transparent preview balls shown on their future board cells">
        <span class="hud-label">Next 3</span>
        <div id="upcoming-swatches" class="upcoming-swatches" aria-label="Upcoming ball colors"></div>
      </div>
      <button id="new-game-btn" class="new-game-btn" type="button">New Game</button>
    </div>
  </header>

  <main class="game-layout">
    <div class="status-bar">
      <p id="status-message" class="status-message" role="status" aria-live="polite">
        Select a ball to move along an open path.
      </p>
    </div>

    <div id="game-over-banner" class="game-over-banner" role="alert" hidden>
      <strong>Game Over</strong> — Final Score: <span id="game-over-score">0</span>. Press <em>New Game</em> to play again.
    </div>

    <section class="board-shell" aria-label="Color Lines 9 by 9 Board">
      <div id="game-board" class="game-board" role="grid" aria-label="9 by 9 game grid"></div>
    </section>

    <p class="rules-hint">
      Align <strong>5+</strong> matching balls horizontally, vertically, or diagonally. Small translucent balls mark where the next 3 balls will spawn.
    </p>
  </main>

  <script type="module" src="/game.js"></script>
</body>
</html>
